name: telepathy

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.server
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 5000
      REDIS_ENABLED: 'true'
      REDIS_STREAM_NAME: telepathy:local:socket.io
      REDIS_PRESENCE_KEY: telepathy:local:presence
      REDIS_MATCHING_ENABLED: 'true'
      REDIS_MATCH_QUEUE_PREFIX: telepathy:local:matching
      REDIS_URL: redis://redis:6379
      SERVE_WEB_STATIC: 'false'
      TRUST_PROXY_HOPS: 0
      WEB_ORIGINS: ${WEB_ORIGINS:-http://localhost:5179,http://localhost:5000}
    init: true
    ports:
      - '127.0.0.1:5000:5000'
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp

  redis:
    image: redis:7.4-alpine
    command:
      - redis-server
      - --save
      - ''
      - --appendonly
      - 'no'
      - --maxmemory
      - 128mb
      - --maxmemory-policy
      - noeviction
    expose:
      - '6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
