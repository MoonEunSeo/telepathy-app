<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- 경로별로 서버가 교체하는 구간이다 (server/src/utils/indexHtml.ts).
         여기 적힌 값은 vite dev 와 교체 실패 시의 폴백이다. -->
    <!--seo-->
    <title>텔레파시 — 같은 단어를 떠올린 사람과 익명 대화</title>
    <meta name="description" content="랜덤채팅 텔레파시에서 같은 단어를 떠올린 사람과 실시간으로 연결되는 특별한 기쁨을 경험하세요. 우연과 감성이 어우러진 대화를 통해 하루에 잊지 못할 설렘과 따뜻함을 더해보세요." />
    <link rel="canonical" href="https://telepathy.my/" />
    <meta name="robots" content="index, follow" />
    <meta property="og:title" content="텔레파시 — 같은 단어를 떠올린 사람과 익명 대화" />
    <meta property="og:description" content="단어 하나로 이어지는 감성 랜덤채팅, Telepathy" />
    <meta property="og:url" content="https://telepathy.my/" />
    <meta name="twitter:title" content="텔레파시 — 같은 단어를 떠올린 사람과 익명 대화" />
    <meta name="twitter:description" content="단어 하나로 이어지는 감성 랜덤채팅, Telepathy" />
    <!--/seo-->

    <!-- 경로와 무관한 값 -->
    <meta name="author" content="Telepathy 팀" />
    <meta
      name="keywords"
      content="텔레파시, 랜덤채팅, 텔레파시 랜덤채팅, 단어매칭, 텔레파시앱, 익명채팅, 심심하다, 소통앱, 텔파"
    />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Telepathy" />
    <meta property="og:locale" content="ko_KR" />
    <meta property="og:image" content="https://telepathy.my/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://telepathy.my/og-image.png" />

    <!-- 아이콘 설정 -->
    <!-- favicon.svg 는 벡터이며 다크 모드 색 전환을 파일 안에서 처리한다.
         SVG 파비콘을 지원하지 않는 Safari·구형 브라우저는 favicon.ico 로 폴백한다. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />

    <!-- 애플 아이콘 -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/apple-touch-icon-dark.png"
      media="(prefers-color-scheme: dark)"
    />

    <!-- PWA 관련 -->
    <meta name="theme-color" content="#3c2f28" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Telepathy" />
    <link rel="manifest" href="/site.webmanifest" />

    <style>
      html,
      body {
        font-family: 'Gowun Dodum', 'Gowun Batang', 'Judson', sans-serif;
      }
    </style>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Telepathy",
        "url": "https://telepathy.my",
        "description": "랜덤채팅 텔레파시, 감정으로 연결되는 실시간 단어 매칭 플랫폼",
        "inLanguage": "ko",
        "author": {
          "@type": "Organization",
          "name": "Telepathy 팀"
        }
      }
    </script>
  </body>
</html>
