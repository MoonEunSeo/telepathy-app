name: CI

on:
  pull_request:
  push:
    branches: [v3]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: |
            package-lock.json
            telepathy-front/package-lock.json

      - name: 루트 의존성 설치
        run: npm ci

      - name: 프론트 의존성 설치
        run: npm ci --prefix telepathy-front

      - name: 전체 검증
        run: npm run verify
